services:
  db:
    image: postgres:17
    container_name: slotly-java-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - slotly-db-data:/var/lib/postgresql/data

volumes:
  slotly-db-data: