# ---- Producción (Etapa 9) ----
# Se activa con SPRING_PROFILES_ACTIVE=prod. Lo que no tiene valor por defecto es obligatorio: si falta, no arranca.

# Detrás del proxy de la plataforma (https): Tomcat toma la IP real de X-Forwarded-For (para el límite de pedidos,
# HU-15) y el https de X-Forwarded-Proto (para que las cookies salgan con Secure). Solo cree lo que agregan los
# proxies de la red interna; lo que manda el navegador en esos headers no cuenta.
server.forward-headers-strategy=native

# Dominio de los subdominios (slotly.com.ar) y dirección de cada local para los links de los mensajes
# (https://{subdominio}.slotly.com.ar).
slotly.dominio-base=${SLOTLY_DOMINIO_BASE}
slotly.url-sitio=${SLOTLY_URL_SITIO}
# Solo para la demo publicada en un dominio sin subdominios por local (por ejemplo, demo).
slotly.local-por-defecto=${SLOTLY_LOCAL_POR_DEFECTO:}

# Documentación de la API (Swagger): prendida para la demo; SLOTLY_DOCUMENTACION_API=false la apaga.
springdoc.api-docs.enabled=${SLOTLY_DOCUMENTACION_API:true}
springdoc.swagger-ui.enabled=${SLOTLY_DOCUMENTACION_API:true}
