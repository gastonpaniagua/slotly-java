spring.application.name=slotly

# ---- Variables del .env ----
spring.config.import=optional:file:../.env[.properties]

# ---- Base de datos ----
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:slotly}
spring.datasource.username=${POSTGRES_USER:slotly}
spring.datasource.password=${POSTGRES_PASSWORD}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false