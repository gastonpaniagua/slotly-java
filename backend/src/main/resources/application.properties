spring.application.name=slotly

# ---- Variables del .env ----
spring.config.import=optional:file:../.env[.properties]

# ---- Base de datos ----
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:slotly}
spring.datasource.username=${POSTGRES_USER:slotly}
spring.datasource.password=${POSTGRES_PASSWORD}
# Si la base no responde, falla a los 5 s en vez de los 30 por defecto (el health contesta 503 rápido)
spring.datasource.hikari.connection-timeout=5000

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- JSON ----
# Un pedido con campos que no existen en el contrato o con el tipo equivocado se rechaza con 400, en vez de
# ignorarlo en silencio (HU-15 CA3: que nadie mande un "estado" o un "precio" y pase desapercibido).
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false

# ---- Slotly ----
# Dominio sobre el que cuelgan los subdominios de los locales (demo.localhost, demo.slotly.com.ar).
# En producción se pisa con la variable de entorno SLOTLY_DOMINIO_BASE.
slotly.dominio-base=localhost